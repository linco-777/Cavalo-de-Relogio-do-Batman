services:
  api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: almoxarifado
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
    - "3307:3306"
    volumes:
      - ./almxfd_db.sql:/docker-entrypoint-initdb.d/almxfd_db.sql